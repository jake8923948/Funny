<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Not My Problem™</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            color: #fff;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 400px;
            width: 100%;
            text-align: center;
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .image-wrapper {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 24px;
            overflow: hidden;
            margin-bottom: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            position: relative;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .image-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            padding: 20px;
        }

        .image-placeholder .emoji {
            font-size: 64px;
            margin-bottom: 12px;
        }

        .badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 16px;
            color: rgba(255, 255, 255, 0.8);
        }

        .quote {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 28px;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 12px;
            background: linear-gradient(to right, #f8f8f8, #c0c0c0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 32px;
            font-weight: 400;
        }

        .reload-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 14px 28px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        .reload-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .reload-btn:active {
            transform: translateY(0);
        }

        .reload-btn svg {
            width: 16px;
            height: 16px;
            transition: transform 0.3s ease;
        }

        .reload-btn:hover svg {
            transform: rotate(180deg);
        }

        .footer {
            margin-top: 40px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 0.5px;
        }

        .footer a {
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
        }

        /* Floating particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: -1;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float linear infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>

    <div class="container">
        <div class="image-wrapper">
            <!-- 
                INSTRUCTIONS: Replace the placeholder below with your own image.
                Option 1: Use a local file - <img src="meme.jpg" alt="Funny image">
                Option 2: Use a URL - <img src="https://example.com/image.jpg" alt="Funny image">
                Just replace the .image-placeholder div with an <img> tag.
            -->
            <div class="image-placeholder">
                <div class="emoji">🤷</div>
                <span>Replace with your own image</span>
                <span style="font-size: 11px; margin-top: 4px; opacity: 0.6;">See HTML comments for instructions</span>
            </div>
        </div>

        <div class="badge">Auto-generated excuse</div>
        <h1 class="quote" id="quote">Loading...</h1>
        <p class="subtitle">— Your friendly neighborhood desk employee</p>

        <button class="reload-btn" onclick="location.reload()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="23 4 23 10 17 10"></polyline>
                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
            </svg>
            Get another excuse
        </button>

        <div class="footer">
            <p>© Not My Problem™ • All rights unreserved</p>
        </div>
    </div>

    <script>
        // Array of snarky phrases - add your own!
        const phrases = [
            "That's a you problem.",
            "Not my circus, not my monkeys.",
            "Have you tried ignoring it?",
            "Sounds like a skill issue.",
            "I'll add it to the list of things I don't care about.",
            "Error 404: Caring not found.",
            "That's above my pay grade.",
            "Let me check... nope, still don't care.",
            "Please submit a ticket to the void.",
            "I'm on lunch. It's 9 AM.",
            "Have you tried turning it off and never turning it back on?",
            "I'm not arguing, I'm just explaining why I'm right.",
            "That sounds like a future me problem. And I don't like him.",
            "Have you considered just... not?",
            "I'd help but I'm emotionally unavailable.",
            "That's a great problem to have.",
            "I believe in you. You'll figure it out.",
            "My calendar says 'not my problem' all day.",
            "Have you tried asking literally anyone else?",
            "I'm delegating this back to you.",
            "That's outside my circle of concern.",
            "I'm sure it'll resolve itself.",
            "Let's put a pin in that. And then lose the pin.",
            "I'm operating at reduced capacity. Like always.",
            "That's a tomorrow problem. And tomorrow I won't care either."
        ];

        // Pick a random phrase
        const randomPhrase = phrases[Math.floor(Math.random() * phrases.length)];
        document.getElementById('quote').textContent = `"${randomPhrase}"`;

        // Create floating particles
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
                particle.style.animationDelay = (Math.random() * 10) + 's';
                particle.style.width = (Math.random() * 4 + 2) + 'px';
                particle.style.height = particle.style.width;
                container.appendChild(particle);
            }
        }

        createParticles();
    </script>
</body>
</html>
