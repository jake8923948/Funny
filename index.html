<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Not My Problem™</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            margin: 0;
            padding: 0;
            touch-action: none;
            -webkit-text-size-adjust: 100%;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            background-attachment: fixed;
            background-size: cover;
            color: #ffffff;
            padding: 16px;
            position: relative;
            transition: transform 0.1s ease;
            width: 100vw;
            max-width: 100vw;
            overflow-x: hidden;
        }

        body.shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-4px, 0, 0); }
            20%, 80% { transform: translate3d(6px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
            40%, 60% { transform: translate3d(8px, 0, 0); }
        }

        .flash-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #ff0000;
            opacity: 0;
            pointer-events: none;
            z-index: 9999;
        }

        .flash-overlay.active {
            animation: flash 0.25s ease-out;
        }

        @keyframes flash {
            0% { opacity: 0; }
            30% { opacity: 0.7; }
            100% { opacity: 0; }
        }

        .jumpscare-text {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 25vw;
            font-weight: 900;
            color: #ff0000;
            text-shadow: 0 0 30px rgba(255, 0, 0, 0.9);
            pointer-events: none;
            z-index: 9998;
            opacity: 0;
            line-height: 1;
        }

        .jumpscare-text.active {
            animation: jumpscare 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes jumpscare {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            40% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
            70% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
        }

        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeInUp 0.6s ease-out;
            max-height: 95vh;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .image-wrapper {
            width: 100%;
            max-width: 340px;
            aspect-ratio: 1 / 1;
            border-radius: 20px;
            overflow: hidden;
            margin: 0 auto 20px auto;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
            background: #16152b;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            pointer-events: none;
        }

        .badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 14px;
            color: rgba(255, 255, 255, 0.9);
            flex-shrink: 0;
        }

        .quote {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(24px, 7vw, 32px);
            font-weight: 700;
            line-height: 1.25;
            margin-bottom: 10px;
            color: #ffffff;
            text-shadow: 0 2px 15px rgba(0, 0, 0, 0.5);
            padding: 0 10px;
        }

        .subtitle {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 24px;
            font-weight: 400;
            flex-shrink: 0;
        }

        .reload-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            padding: 14px 24px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
            flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
        }

        .reload-btn:active {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(0.96);
        }

        .reload-btn svg {
            width: 16px;
            height: 16px;
            transition: transform 0.3s ease;
        }

        .reload-btn:active svg {
            transform: rotate(180deg);
        }

        .footer {
            margin-top: 20px;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 0.5px;
            flex-shrink: 0;
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: -1;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            animation: float linear infinite;
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-50px) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="jumpscare-text" id="jumpscareText">💀</div>
    <div class="particles" id="particles"></div>

        </div>

        <p class="subtitle">— Management approved this message</p>

        <button class="reload-btn" id="reloadBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="23 4 23 10 17 10"></polyline>
                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>

            Next
        </button>

        <div class="footer">
            <p>© Not My Problem™ • All rights unreserved</p>
        </div>
    </div>

        const phrases = [
            "Not my problem.", "I don't care.", "Sounds like a you problem.", "Figure it out yourself.",

            "Take it up with someone who cares.", "I'm going to pretend I didn't hear that.",

            "That's a 'call the authorities' level of nope.", "I'm preserving my energy for things that don't make me gag.",

            "That sounds like a lot of effort. So, no.", "My job description does not include 'fixing your mess'.",

            "I would explain why I'm not doing it, but I don't have the crayons.",
            "That's a great idea for someone else to execute.", "I'm saving my energy for problems that actually pay me.",
            "I'm currently identifying as 'not your manager'.", "My empathy module is currently under maintenance. Indefinitely.",

            "I'm going to need you to problem-solve this without my involvement.",
            "Let's agree to disagree that this is my problem.", "I'm on a strictly need-to-know basis, and you don't need to know.",

            "That sounds like a 'figure it out' kind of Tuesday.",
            "I'm currently accepting applications for someone who cares. You are not a candidate."
        ];

        function getPhraseCounts() {
            const stored = localStorage.getItem('phraseCounts_v2');
            if (stored) return JSON.parse(stored);
            const counts = {};
            phrases.forEach((_, index) => { counts[index] = 0; });
            return counts;
        }

        function savePhraseCounts(counts) {
            localStorage.setItem('phraseCounts_v2', JSON.stringify(counts));
        }

        function selectPhrase() {
            const counts = getPhraseCounts();
            const weights = phrases.map((_, index) => {
                const count = counts[index] || 0;
                return Math.pow(count + 1, -0.85);
            });
            
            const totalWeight = weights.reduce((sum, weight) => sum + weight, 0);
            let random = Math.random() * totalWeight;
            let selectedIndex = 0;
            
            for (let i = 0; i < weights.length; i++) {
                random -= weights[i];
                if (random <= 0) {
                    selectedIndex = i;
                    break;
                }
            }
            
            counts[selectedIndex] = (counts[selectedIndex] || 0) + 1;
            savePhraseCounts(counts);
            return phrases[selectedIndex];
        }

        function loadNewContent() {
            const randomImage = imageUrls[Math.floor(Math.random() * imageUrls.length)];
            document.getElementById('memeImage').src = randomImage;
            
            const selectedPhrase = selectPhrase();
            document.getElementById('quote').textContent = `"${selectedPhrase}"`;
        }

        loadNewContent();

        document.getElementById('reloadBtn').addEventListener('click', (e) => {
            e.preventDefault();
            loadNewContent();
        });

        function triggerJumpscare() {
            if (Math.random() < 0.15) {
                const body = document.body;
                const flashOverlay = document.getElementById('flashOverlay');
                const jumpscareText = document.getElementById('jumpscareText');
                
                if (navigator.vibrate) {
                    navigator.vibrate([50, 50, 100]);
                }
                
                body.classList.add('shake');
                setTimeout(() => body.classList.remove('shake'), 400);
                
                flashOverlay.classList.add('active');
                setTimeout(() => flashOverlay.classList.remove('active'), 250);
                
                // FIXED: Removed empty strings from emoji array
                const scaryEmojis = ['💀', '👻', '😱', '🔥', '⚡', '🤡'];
                jumpscareText.textContent = scaryEmojis[Math.floor(Math.random() * scaryEmojis.length)];
                jumpscareText.classList.add('active');
                setTimeout(() => jumpscareText.classList.remove('active'), 500);
            }
        }

        setTimeout(triggerJumpscare, 600);

        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 15; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDuration = (Math.random() * 12 + 8) + 's';
                particle.style.animationDelay = (Math.random() * 10) + 's';
                const size = Math.random() * 3 + 1;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                container.appendChild(particle);
            }
        }
        createParticles();
